<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Furo-Locator Mobile</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 🗺️ LEAFLET CSS & JS (Para o Mapa Mobile) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { background-color: #f8fafc; }
        input[type="text"] { font-size: 16px; } 
        /* Define a altura do mapa e garante que não se sobrepõe aos menus */
        #mapa { height: 280px; z-index: 1; border-radius: 0.5rem; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-blue-600 text-white p-3 shadow-md text-center flex justify-between items-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-map-location-dot"></i> Furo-Locator</h1>
        <button onclick="toggleConfig()" class="text-blue-200 hover:text-white"><i class="fa-solid fa-cog"></i></button>
    </header>

    <main class="flex-1 p-4 flex flex-col gap-4 max-w-md mx-auto w-full">
        
        <!-- Bloco de Configuração (Oculto por defeito) -->
        <div id="config-block" class="hidden bg-slate-800 p-4 rounded-xl shadow-sm text-white">
            <label class="block text-xs font-semibold text-slate-300 mb-1">PIN da Empresa</label>
            <div class="flex gap-2">
                <input type="text" id="pin-input" placeholder="Ex: 1001" class="flex-1 bg-slate-700 border-none text-white rounded-lg px-3 py-2 focus:outline-none">
                <button onclick="salvarPin()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold"><i class="fa-solid fa-check"></i></button>
            </div>
        </div>

        <!-- 🗺️ O MAPA VISUAL AQUI -->
        <div id="mapa" class="w-full shadow-sm"></div>

        <!-- Bloco de Cliente e Ações -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-sm font-semibold text-slate-700 mb-1">Código do Cliente</label>
            <input type="text" id="cliente-input" placeholder="Ex: CL-045" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 mb-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
            
            <div class="flex gap-2">
                <!-- Botão 1: Apenas encontrar a localização no mapa -->
                <button onclick="localizarNoMapa()" class="w-1/3 bg-slate-200 text-slate-700 font-bold py-3 rounded-lg hover:bg-slate-300 active:scale-95 transition">
                    <i class="fa-solid fa-crosshairs"></i> GPS
                </button>
                
                <!-- Botão 2: Enviar para a Nuvem -->
                <button onclick="enviarParaNuvem()" class="w-2/3 bg-blue-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-blue-500 active:scale-95 transition">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Guardar Cliente
                </button>
            </div>
        </div>

        <!-- Consola de Status -->
        <div id="status-box" class="bg-white text-slate-600 border border-slate-200 p-3 rounded-xl font-mono text-xs text-center">
            Pronto. Ligue o GPS e clique em "GPS".
        </div>

    </main>

    <script>
        // ==========================================
        // 1. CONFIGURAÇÕES DA NUVEM
        // ==========================================
        const SUPABASE_URL = "https://pgyjonhtlycvhgjkihpe.supabase.co";
        // ⚠️ MUDE A CHAVE AQUI ABAIXO:
        const SUPABASE_ANON_KEY = "sb_publishable_zRLs-Yo_z1_PcfJRUY4R4Q_vg29fHzd"; 
        
        let supabase = null;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error("Erro ao iniciar Supabase. Verifique a chave.", e);
        }

        // Variáveis do Mapa
        let mapa = null;
        let pinoAtual = null;
        let coordenadasCapturadas = null; // Guarda a [latitude, longitude, precisão]

        // ==========================================
        // 2. INICIALIZAÇÃO DA INTERFACE & MAPA
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            // Carrega PIN
            const pinGuardado = localStorage.getItem("furo_pin");
            if (pinGuardado) document.getElementById("pin-input").value = pinGuardado;
            else toggleConfig(); // Se não tem PIN, abre a configuração

            // Inicia o Mapa centrado em Moçambique
            mapa = L.map('mapa').setView([-18.665, 35.529], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(mapa);
        });

        function toggleConfig() {
            document.getElementById("config-block").classList.toggle("hidden");
        }

        function salvarPin() {
            const pin = document.getElementById("pin-input").value.trim();
            if (pin) {
                localStorage.setItem("furo_pin", pin);
                toggleConfig();
                mostrarStatus("✅ PIN guardado.", "text-green-600");
            }
        }

        function mostrarStatus(mensagem, cor = "text-slate-600") {
            const box = document.getElementById("status-box");
            box.className = `bg-white border border-slate-200 p-3 rounded-xl font-mono text-xs text-center ${cor}`;
            box.innerHTML = mensagem;
        }

        // ==========================================
        // 3. CAPTURA DE GPS NO MAPA
        // ==========================================
        function localizarNoMapa() {
            if (!navigator.geolocation) {
                return mostrarStatus("❌ Navegador não suporta GPS.", "text-red-600");
            }

            mostrarStatus("<i class='fa-solid fa-spinner fa-spin'></i> A procurar satélites...", "text-blue-600");

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const acc = pos.coords.accuracy;
                    coordenadasCapturadas = { lat, lng, acc };

                    // Voar para o local no mapa
                    mapa.flyTo([lat, lng], 17);

                    // Adicionar/Atualizar Pino no mapa
                    if (pinoAtual) {
                        pinoAtual.setLatLng([lat, lng]);
                    } else {
                        pinoAtual = L.marker([lat, lng]).addTo(mapa);
                    }
                    
                    // Adicionar um círculo mostrando a precisão
                    pinoAtual.bindPopup(`Precisão: ${acc.toFixed(0)}m`).openPopup();

                    mostrarStatus(`✅ Localização encontrada! Precisão: ${acc.toFixed(0)}m.`, "text-green-600");
                },
                (err) => {
                    mostrarStatus(`❌ Erro GPS: ${err.message}`, "text-red-600");
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        // ==========================================
        // 4. ENVIO PARA O SUPABASE
        // ==========================================
        async function enviarParaNuvem() {
            if (!supabase) return mostrarStatus("❌ Erro interno do Supabase.", "text-red-600");
            
            const pin = document.getElementById("pin-input").value.trim();
            const cliente = document.getElementById("cliente-input").value.trim().toUpperCase();

            if (!pin) return mostrarStatus("❌ Insira o PIN nas definições (Roda dentada).", "text-red-600");
            if (!cliente) return mostrarStatus("❌ Insira o código do cliente!", "text-red-600");
            if (!coordenadasCapturadas) return mostrarStatus("❌ Clique em 'GPS' primeiro!", "text-red-600");

            mostrarStatus("<i class='fa-solid fa-cloud-arrow-up fa-bounce'></i> A guardar na nuvem...", "text-blue-600");

            const payload = {
                pin_empresa: pin,
                codigo_cliente: cliente,
                latitude: coordenadasCapturadas.lat,
                longitude: coordenadasCapturadas.lng,
                accuracy_m: coordenadasCapturadas.acc
            };

            try {
                const { data, error } = await supabase.from('coordenadas_campo').insert([payload]);

                if (error) throw new Error(error.message);

                mostrarStatus(`✅ Cliente ${cliente} guardado com sucesso!`, "text-green-600");
                document.getElementById("cliente-input").value = "";
                
            } catch (error) {
                mostrarStatus(`❌ Falha: ${error.message}`, "text-red-600");
            }
        }
    </script>
</body>
</html>
